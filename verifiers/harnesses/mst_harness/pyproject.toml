[project]
name = "mst-harness"
version = "2.0.0rc0"
description = "Run MST (MCP Server Tester) clients as verifiers harnesses"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
  # The Harness.launch() contract and `env.agent.harness` config of verifiers 0.4.
  "verifiers>=0.4.1,<0.5",
]

[project.urls]
Homepage = "https://github.com/gleanwork/mcp-server-tester"
Documentation = "https://github.com/gleanwork/mcp-server-tester/blob/main/docs/verifiers.md"

[dependency-groups]
# mst-smoke is the smoke taskset next door, for `vf-validate mst-smoke` and `vf-run mst-smoke`.
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "pyright>=1.1.380", "mst-smoke"]

[tool.uv.sources]
mst-smoke = { path = "../../environments/mst_smoke", editable = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mst_harness"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
# The harness only: the smoke taskset is written as verifiers' own example tasksets are,
# which strict mode doesn't accept (Ruff checks it).
include = ["mst_harness", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
