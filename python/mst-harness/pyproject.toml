[project]
name = "mst-harness"
version = "2.0.0rc0"
description = "Run MST (MCP Server Tester) clients as verifiers harnesses"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
  # verifiers 0.2 is the release whose Harness.launch() contract this package implements.
  # verifiers 0.4 moved to rollout-scoped sessions (ACPHarness); see ADR 0015.
  "verifiers>=0.2.1,<0.3",
]

[project.urls]
Homepage = "https://github.com/gleanwork/mcp-server-tester"
Documentation = "https://github.com/gleanwork/mcp-server-tester/blob/main/docs/verifiers.md"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "pyright>=1.1.380"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mst_harness"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
