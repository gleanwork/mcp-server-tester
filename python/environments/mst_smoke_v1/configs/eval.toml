# Run from this directory: uv run eval @ configs/eval.toml
# MST must be on PATH, or set harness.mst_command.
model = "claude-sonnet-4-6"
num_rollouts = 1
max_concurrent = 2
push = false

[taskset]
id = "mst-smoke-v1"

[harness]
id = "mst-harness"
# claude-code reads Claude Code's managed settings, which can pin the model endpoint
# and bypass the interception; the api client takes only the environment.
client = "api"
api = "anthropic"
client_options = { timeout = 300000 }

[harness.runtime]
type = "subprocess"

[client]
type = "eval"
base_url = "https://api.anthropic.com"
api_key_var = "ANTHROPIC_API_KEY"

[interception]
type = "server"
