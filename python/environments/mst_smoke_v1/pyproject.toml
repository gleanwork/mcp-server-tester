[project]
name = "mst-smoke-v1"
version = "0.1.0"
description = "A verifiers environment that runs MST clients through mst-harness end to end."
requires-python = ">=3.11,<3.14"
dependencies = ["verifiers>=0.2.1,<0.3", "mst-harness"]

[tool.uv.sources]
mst-harness = { path = "../../mst-harness", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mst_smoke_v1"]
