name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Not ubuntu-latest: that is Ubuntu 26.04 now, and Playwright 1.57 can't
    # install its browsers there. Move on with a Playwright that supports it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - run: npm ci

      - run: npm run format:check

      # Legacy examples resolve package self-imports through dist. The check
      # fails when a bundle carries an unused import from an external package.
      - name: Build
        run: npm run build:check

      - run: npm run typecheck

      - run: npm run lint

      - name: Unused files, exports and dependencies
        run: npm run knip

      - run: npm run docs:check

      - name: Public evaluation foundation contracts
        run: npm run test:eval-foundation

      - name: CLI smoke
        run: npm run test:eval-review

      - name: Use cases through the CLI
        run: npm run test:usecases

      - run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - run: npm run test:playwright

  # The docs site in website/: it renders docs/ and serves it, with skills/,
  # over MCP. This job only builds and tests it; deploy-website.yml deploys it
  # to Vercel when a release is tagged.
  website:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      # The site's MCP tests run on MST from this checkout.
      - run: npm ci

      - name: Install site dependencies
        working-directory: website
        run: npm ci

      - name: Typecheck the site
        working-directory: website
        run: npm run typecheck

      - name: Unit tests for the site
        working-directory: website
        run: npm test

      # Fails on a broken link or anchor, in docs/ or out of it. postbuild
      # runs docusaurus-mcp-verify on the MCP bundle.
      - name: Build the site
        working-directory: website
        run: npm run build

      - name: Smoke-test the MCP endpoint
        working-directory: website
        run: npm run smoke

      # Conformance, the docs tools and every skill, in both protocol eras,
      # over the function Vercel deploys.
      - name: Test the site's MCP server with MST
        run: npm run test:site
