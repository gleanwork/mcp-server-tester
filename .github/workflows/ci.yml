name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - run: npm ci

      - run: npm run format:check

      # Legacy examples resolve package self-imports through dist. The check
      # fails when a bundle carries an unused import from an external package.
      - name: Build
        run: npm run build:check

      - run: npm run typecheck

      - run: npm run lint

      - name: Unused files, exports and dependencies
        run: npm run knip

      - run: npm run docs:check

      - name: Public evaluation foundation contracts
        run: npm run test:eval-foundation

      - name: CLI smoke
        run: npm run test:eval-review

      - name: Use cases through the CLI
        run: npm run test:usecases

      - run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - run: npm run test:playwright
