# Publishes the package to npm when a release tag is pushed.
#
# A maintainer runs `npx release-it` locally; it bumps the version, writes the
# changelog, commits, tags `v<version>`, pushes, and creates the GitHub Release,
# but does not publish (`npm.publish` is off in package.json). The tag push
# triggers this workflow, which publishes from CI with npm trusted publishing:
# npm trusts this repository's `publish.yml` running in the `npm` environment,
# through GitHub's OIDC token (`id-token: write`), so there is no npm token
# anywhere, and the tarball carries a provenance attestation tying it to this
# commit and workflow run.
#
# Two jobs on purpose. `build` installs dependencies and builds the tarball with
# no OIDC token in reach, so no dependency's install script can publish.
# `publish` has the token but installs nothing: it publishes the tarball it was
# handed. The `npm` environment requires a maintainer's approval, so a `v*` tag
# alone, from anyone with write access, cannot publish. See RELEASE.md for the
# one-time setup on GitHub and npm.
name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    name: Build the release tarball
    runs-on: ubuntu-24.04
    permissions:
      actions: read # list CI runs for the release commit
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      dist_tag: ${{ steps.version.outputs.dist_tag }}

    steps:
      - name: Check out the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The release commit lands on main moments before its tag, so its CI run
      # may still be going, or may not have started. Publish only a commit whose
      # push CI passed.
      - name: Require a green CI run for the release commit
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        timeout-minutes: 45
        with:
          script: |
            const deadline = Date.now() + 44 * 60 * 1000;
            for (;;) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'ci.yml',
                head_sha: context.sha,
                event: 'push',
                per_page: 100,
              });
              if (runs.some((run) => run.conclusion === 'success')) return;
              const active = runs.some((run) => run.status !== 'completed');
              if (runs.length > 0 && !active) {
                core.setFailed(`CI did not pass for release commit ${context.sha}.`);
                return;
              }
              if (Date.now() >= deadline) {
                core.setFailed(`Timed out waiting for CI on release commit ${context.sha}.`);
                return;
              }
              await new Promise((resolve) => setTimeout(resolve, 15000));
            }

      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4

      - name: Require the tag to match package.json
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A prerelease (2.0.0-beta.15) publishes under its prerelease
          # identifier as the dist-tag (beta). A release passes no dist-tag, so
          # npm applies `latest` itself and refuses to move it backwards.
          case "$version" in
            *-*)
              tag="${version#*-}"
              tag="${tag%%.*}"
              # npm rejects a dist-tag that parses as a semver range (v2, x).
              if ! printf '%s' "$tag" | grep -Eq '^[a-z][a-z0-9-]*$' || printf '%s' "$tag" | grep -Eq '^(v[0-9]|x$)'; then
                echo "::error::Prerelease $version has no named identifier usable as a dist-tag."
                exit 1
              fi
              ;;
            *) tag="" ;;
          esac
          echo "dist_tag=$tag" >> "$GITHUB_OUTPUT"

      - run: npm ci

      # `npm ci` already ran `prepare` (the build); pack from that output.
      - name: Pack
        run: |
          npm pack --ignore-scripts
          mv ./*.tgz package.tgz
          npm pack --ignore-scripts --dry-run --json > pack-manifest.json
          node -e "const m = require('./pack-manifest.json')[0]; console.log(m.filename, m.entryCount, 'files', m.size, 'bytes')"

      - name: Hand the tarball to the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-${{ github.sha }}
          path: package.tgz
          if-no-files-found: error
          retention-days: 7 # outlives a slow environment approval

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance

    steps:
      - name: Receive the tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package-${{ github.sha }}

      # npm 11.5.1 or later is needed for trusted publishing; Node 24 ships a
      # later npm. Nothing from the repository or its dependencies is installed
      # in this job.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm --version

      - name: Publish
        env:
          VERSION: ${{ needs.build.outputs.version }}
          DIST_TAG: ${{ needs.build.outputs.dist_tag }}
        run: |
          packed="$(tar -xOf package.tgz package/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")"
          if [ "$packed" != "$VERSION" ]; then
            echo "::error::Tarball version $packed does not match release version $VERSION."
            exit 1
          fi
          set -- --provenance --access public --ignore-scripts
          if [ -n "$DIST_TAG" ]; then set -- "$@" --tag "$DIST_TAG"; fi
          npm publish ./package.tgz "$@"
