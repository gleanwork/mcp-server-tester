# Publishes the package to npm when a release tag is pushed.
#
# A maintainer runs `npx release-it` locally; it bumps the version, writes the
# changelog, commits, tags `v<version>`, pushes, and creates the GitHub Release,
# but does not publish (`npm.publish` is off in package.json). The tag push
# triggers this workflow, which publishes from CI with npm trusted publishing:
# npm trusts this repository's `publish.yml` through GitHub's OIDC token
# (`id-token: write`), so there is no npm token anywhere, and the tarball
# carries a provenance attestation tying it to this commit and workflow.
#
# One-time setup on npmjs.com, by a package maintainer: package Settings ->
# Trusted Publisher -> GitHub Actions, organization `gleanwork`, repository
# `mcp-server-tester`, workflow filename `publish.yml`, no environment. Then,
# under Publishing access, require two-factor authentication and disallow
# tokens, so this workflow is the only way to publish.
name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-24.04
    permissions:
      actions: read # list CI runs for the release commit
      contents: read
      id-token: write # npm trusted publishing and provenance

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The release commit lands on main moments before its tag, so its CI run
      # may still be going. Publish only a commit whose push CI passed.
      - name: Require a green CI run for the release commit
        uses: actions/github-script@v7
        timeout-minutes: 45
        with:
          script: |
            const deadline = Date.now() + 44 * 60 * 1000;
            for (;;) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'ci.yml',
                head_sha: context.sha,
                event: 'push',
                per_page: 100,
              });
              if (runs.some((run) => run.conclusion === 'success')) return;
              const active = runs.some((run) => run.status !== 'completed');
              if (runs.length > 0 && !active) {
                core.setFailed(`CI did not pass for release commit ${context.sha}.`);
                return;
              }
              if (Date.now() >= deadline) {
                core.setFailed(`Timed out waiting for CI on release commit ${context.sha}.`);
                return;
              }
              await new Promise((resolve) => setTimeout(resolve, 15000));
            }

      - uses: jdx/mise-action@v2

      - name: Require the tag to match package.json
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A prerelease (2.0.0-beta.15) publishes under its prerelease
          # identifier as the dist-tag (beta); a release publishes as latest.
          case "$version" in
            *-*) tag="${version#*-}"; tag="${tag%%.*}" ;;
            *) tag=latest ;;
          esac
          echo "dist_tag=$tag" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - run: npm run build

      # --ignore-scripts: prepublishOnly reruns the whole test suite, which CI
      # already passed for this commit, and prepare rebuilds what was just built.
      - name: Publish
        env:
          DIST_TAG: ${{ steps.version.outputs.dist_tag }}
        run: npm publish --provenance --access public --tag "$DIST_TAG" --ignore-scripts
