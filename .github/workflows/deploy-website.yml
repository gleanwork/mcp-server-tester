name: Deploy website

# Deploys the docs site in website/ to Vercel. It runs by hand for now; once
# 2.0 is released it should run for each release, so the published docs match
# the published package.
#
# The site is built on the runner (`vercel build`) and uploaded as prebuilt
# output (`vercel deploy --prebuilt`), so Vercel runs no build. Git-triggered
# Vercel deployments are off in website/vercel.json.
#
# Needs the repository variables VERCEL_ORG_ID and VERCEL_PROJECT_ID (not
# credentials) and the secret VERCEL_TOKEN. Leave the Vercel project's Root
# Directory empty: this workflow runs the CLI from website/.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to deploy
        required: false
        default: main

concurrency:
  group: deploy-website
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-24.04
    environment:
      name: website
      url: https://mcp-server-tester.vercel.app
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check the Vercel settings
        run: |
          missing=""
          [ -n "$VERCEL_ORG_ID" ] || missing="$missing VERCEL_ORG_ID (variable)"
          [ -n "$VERCEL_PROJECT_ID" ] || missing="$missing VERCEL_PROJECT_ID (variable)"
          [ -n "$VERCEL_TOKEN" ] || missing="$missing VERCEL_TOKEN (secret)"
          if [ -n "$missing" ]; then
            echo "::error::Set these on the repository first:$missing"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: jdx/mise-action@v2

      - name: Install site dependencies
        working-directory: website
        run: npm ci

      - name: Install the Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        working-directory: website
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      # Runs `npm run build` (with docusaurus-mcp-verify) and bundles api/mcp.mjs.
      - name: Build
        working-directory: website
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Smoke-test the MCP endpoint
        working-directory: website
        run: npm run smoke

      - name: Deploy
        working-directory: website
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Check the production endpoint
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors \
            https://mcp-server-tester.vercel.app/mcp
